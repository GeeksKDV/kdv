<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDV - Официальный сайт</title>
    <style>
        /* Базовые стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Шапка сайта */
        header {
            background-color: #000000;
            padding: 20px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff5500;
            text-decoration: none;
        }
        
        /* Главный экран */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://avatars.yandex.net/get-music-content/15018579/23ce9d84.p.3530293/m1000x1000') center/cover;
            display: flex;
            align-items: center;
            text-align: center;
            margin-top: 60px;
        }
        
        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #cccccc;
        }
        
        /* Альбомы */
        .albums {
            padding: 80px 0;
            background-color: #1a1a1a;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5rem;
            color: #ff5500;
        }
        
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .album-card {
            background: #252525;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        
        .album-card:hover {
            transform: translateY(-10px);
        }
        
        .album-img {
            height: 300px;
            overflow: hidden;
        }
        
        .album-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .album-card:hover .album-img img {
            transform: scale(1.1);
        }
        
        .album-info {
            padding: 20px;
        }
        
        .album-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        .album-year {
            color: #aaaaaa;
            margin-bottom: 15px;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #ff5500;
            color: #000000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background-color: #ff7733;
            color: #000000;
        }
        
        /* Подвал */
        footer {
            background-color: #000000;
            padding: 40px 0;
            text-align: center;
        }
        
        .copyright {
            color: #666666;
        }
    </style>
</head>
<body>
    <!-- Шапка сайта -->
    <header>
        <div class="container">
            <div class="header-inner">
                <a href="#" class="logo">KDV</a>
            </div>
        </div>
    </header>

    <!-- Главный экран -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>KDV MUSIC</h1>
                <p>Официальный сайт музыканта</p>
            </div>
        </div>
    </section>

    <!-- Альбомы -->
    <section class="albums">
        <div class="container">
            <h2 class="section-title">Альбомы</h2>
            
            <div class="album-grid">
                <!-- Альбом "Парадигма" -->
                <div class="album-card">
                    <div class="album-img">
                        <img src="https://avatars.yandex.net/get-music-content/14854709/8548734c.a.36107387-1/600x600" alt="Парадигма">
                    </div>
                    <div class="album-info">
                        <h3 class="album-title">Парадигма</h3>
                        <div class="album-year">2023</div>
                        <a href="https://music.yandex.ru/album/36107387" class="btn" target="_blank">Слушать</a>
                    </div>
                </div>
                
                <!-- Здесь можно добавить другие альбомы -->
            </div>
        </div>
    </section>

    <!-- Подвал -->
    <footer>
        <div class="container">
            <p class="copyright">© 2023 KDV Music. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
